name: Diagnose easytier package drop 5

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@v4
      - name: Clone source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/cnjn/ImmortalWrt openwrt
          cd openwrt && git checkout 1b50aaf4ed9cf042df6207564555b244d6ced517
      - name: Overlays and feeds
        run: |
          cp -a overlays/. openwrt/
          cd openwrt
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci
      - name: Is the makefile even parsed? Run make with our package as the goal
        run: |
          cd openwrt
          echo '=== make package/luci-app-easytier/compile (expect a parse or a target) ==='
          make package/luci-app-easytier/compile V=s 2>&1 | head -n 40 || true
      - name: Compare with the working sibling app
        run: |
          cd openwrt
          echo '=== sibling that ships today: luci-app-sk-d840n-pon ==='
          cat -A package/luci-app-sk-d840n-pon/Makefile | head -n 30
          echo '=== does the sibling appear in .config-package.in? ==='
          grep -n 'Package/luci-app-sk-d840n-pon' tmp/.config-package.in | head -n 5 || echo 'sibling ALSO absent'
          echo '=== which luci apps ARE in .config-package.in? ==='
          grep -c '^config PACKAGE_luci-app' tmp/.config-package.in || true
      - name: List .config-package.in entries mentioning easytier or sk-d840n
        run: |
          cd openwrt
          grep -n 'easytier\|sk-d840n\|skd840n' tmp/.config-package.in | head -n 40 || echo NONE