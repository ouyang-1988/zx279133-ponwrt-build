name: Diagnose easytier package drop 3

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - uses: actions/checkout@v4

      - name: Clone source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/cnjn/ImmortalWrt openwrt
          cd openwrt && git checkout 1b50aaf4ed9cf042df6207564555b244d6ced517

      - name: Overlays and feeds
        run: |
          cp -a overlays/. openwrt/
          cd openwrt
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci

      - name: Try four candidate luci Makefiles
        run: |
          cd openwrt
          PKG=package/luci-app-easytier
          run_variant () {
            local name="$1"
            local body="$2"
            printf '%s\n' "$body" > "$PKG/Makefile"
            echo "########## VARIANT $name ##########"
            cp target/linux/zte/zx279133/config-default .config 2>/dev/null || true
            printf 'CONFIG_TARGET_zte=y\nCONFIG_TARGET_zte_zx279133=y\nCONFIG_TARGET_zte_zx279133_DEVICE_skyworth_sk-d840n=y\n' >> .config
            printf 'CONFIG_PACKAGE_easytier=y\nCONFIG_PACKAGE_luci-app-easytier=y\n' >> .config
            rm -f tmp/.packageinfo tmp/.config-package.in 2>/dev/null || true
            make defconfig > /tmp/dc-$name.log 2>&1 || true
            if grep -qx 'CONFIG_PACKAGE_luci-app-easytier=y' .config; then
              echo "RESULT $name: SURVIVED"
            else
              echo "RESULT $name: DROPPED"
              grep -i 'luci-app-easytier' /tmp/dc-$name.log | head -n 5 || true
            fi
            grep -c 'CONFIG_PACKAGE_easytier=y' .config | sed "s/^/easytier-lines: /"
          }

          V1='include $(TOPDIR)/rules.mk

          LUCI_TITLE:=t
          LUCI_DEPENDS:=+luci-base
          LUCI_PKGARCH:=$(ARCH_PACKAGES)
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1

          include $(TOPDIR)/feeds/luci/luci.mk'

          V2='include $(TOPDIR)/rules.mk

          LUCI_TITLE:=t
          LUCI_DEPENDS:=+luci-base
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1

          include $(TOPDIR)/feeds/luci/luci.mk'

          V3='include $(TOPDIR)/rules.mk

          LUCI_TITLE:=t
          LUCI_DEPENDS:=+luci-base +easytier
          LUCI_PKGARCH:=$(ARCH_PACKAGES)
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1

          include $(TOPDIR)/feeds/luci/luci.mk'

          V4='include $(TOPDIR)/rules.mk

          LUCI_TITLE:=t
          LUCI_DEPENDS:=+luci-base +easytier
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1

          include $(TOPDIR)/feeds/luci/luci.mk'

          run_variant v1 "$(echo "$V1" | sed 's/^ *//')"
          run_variant v2 "$(echo "$V2" | sed 's/^ *//')"
          run_variant v3 "$(echo "$V3" | sed 's/^ *//')"
          run_variant v4 "$(echo "$V4" | sed 's/^ *//')"

      - name: Show defconfig warnings for our package
        run: |
          for f in /tmp/dc-v*.log; do echo "== $f"; grep -i 'easytier' "$f" | head -n 8 || true; done
