name: Diagnose easytier package drop

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone ImmortalWrt source
        env:
          IW_URL: https://github.com/cnjn/ImmortalWrt
          IW_BRANCH: sr1010-zx279133
          IW_SHA: 1b50aaf4ed9cf042df6207564555b244d6ced517
        run: |
          git clone --filter=blob:none --no-checkout "$IW_URL" openwrt
          cd openwrt
          git checkout "$IW_SHA"
          git rev-parse HEAD
          cd ..

      - name: Apply overlays
        run: |
          cp -a overlays/. openwrt/
          ls -la openwrt/package/luci-app-easytier openwrt/package/network/utils/easytier

      - name: Install luci feed
        run: |
          cd openwrt
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci
          ls -l feeds/luci/luci.mk || true

      - name: Seed config
        run: |
          cd openwrt
          cp target/linux/zte/zx279133/config-default .config 2>/dev/null || true
          printf 'CONFIG_TARGET_zte=y\nCONFIG_TARGET_zte_zx279133=y\nCONFIG_TARGET_zte_zx279133_DEVICE_skyworth_sk-d840n=y\n' >> .config
          printf 'CONFIG_PACKAGE_easytier=y\nCONFIG_PACKAGE_luci-app-easytier=y\n' >> .config
          echo '--- before defconfig ---'
          grep -n easytier .config

      - name: defconfig
        run: |
          cd openwrt
          make defconfig 2>&1 | tail -n 40
          echo '--- after defconfig ---'
          grep -n easytier .config || echo 'NO easytier IN .config'

      - name: Dump package metadata
        run: |
          cd openwrt
          echo '===== luci-app-easytier/dump ====='
          make -s package/luci-app-easytier/dump 2>&1 | head -n 60 || true
          echo '===== easytier/dump ====='
          make -s package/easytier/dump 2>&1 | head -n 60 || true
          echo '===== package index grep easytier ====='
          make -s package/index 2>&1 | tail -n 5 || true
          find tmp -name '*.index*' 2>/dev/null | head

      - name: Explain missing deps
        run: |
          cd openwrt
          echo '===== does luci.mk exist? ====='
          ls -l feeds/luci/luci.mk 2>&1 || true
          echo '===== easytier in package metadata? ====='
          grep -rn 'easytier' tmp/.packageinfo 2>/dev/null | head -n 20 || echo 'no tmp/.packageinfo'
          echo '===== aarch64 arch? ====='
          grep -n 'CONFIG_ARCH\|CONFIG_TARGET_ARCH_PACKAGES' .config | head
